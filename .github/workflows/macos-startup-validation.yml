name: Mac startup validation
on:
  push:
    branches: ['codex/mac-startup-validation']
    paths: ['.github/workflows/macos-startup-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact local candidate patch
        env:
          CANDIDATE_PATCH: ""
        run: |
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,os,subprocess
          data=gzip.decompress(base64.b64decode(os.environ['CANDIDATE_PATCH']))
          print('Candidate patch SHA256:',hashlib.sha256(data).hexdigest())
          subprocess.run(['git','apply','--check','-'],input=data,check=True)
          subprocess.run(['git','apply','-'],input=data,check=True)
          PYCODE
      - name: Test core and build signed universal app
        run: |
          sw_vers
          ./macos/build.sh
      - name: Launch packaged app and check real AppKit interface
        run: python3 macos/check-startup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mac-startup-validation-${{ matrix.runner }}
          path: |
            macos/dist/OpenRouterUsage-macOS-universal.zip
            macos/dist/startup-check*.png
          if-no-files-found: warn
