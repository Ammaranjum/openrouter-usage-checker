name: macOS companion
on:
  workflow_dispatch:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test and build universal development app
        run: ./macos/build.sh
      - name: Launch packaged app and check menu bar and settings
        run: python3 macos/check-startup.py
      - name: Upload development build (not notarized)
        uses: actions/upload-artifact@v4
        with:
          name: OpenRouterUsage-macOS-development-${{ matrix.runner }}
          path: macos/dist/OpenRouterUsage-macOS-universal.zip
          if-no-files-found: error
      - name: Upload startup window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: macOS-startup-check-${{ matrix.runner }}
          path: macos/dist/startup-check-*.png
          if-no-files-found: error
